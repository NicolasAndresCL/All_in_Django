name: Publicar imágenes

# Publica las imágenes en GHCR al pushear un tag vX.Y.Z. Solo el tag: si también se
# disparara con `release: published`, cada versión construiría y subiría todo dos veces
# (release.yml crea la release con ese mismo push).
# Usa el GITHUB_TOKEN (no requiere secretos extra); el paquete queda en
# ghcr.io/<owner>/all-in-django-{api,ui}.

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: all-in-django-api
            context: .
          - image: all-in-django-ui
            context: ./nicegui_ui
    steps:
      - uses: actions/checkout@v7

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # metadata-action añade `latest` por defecto en los tags semver. Se apaga: el
          # despliegue exige un tag inmutable (Jenkinsfile, Terraform y Helm rechazan latest).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
