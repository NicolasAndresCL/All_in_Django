[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = -q -m "not visual"
# Tests async de la UI NiceGUI (nicegui.testing User); no afecta a los tests síncronos.
asyncio_mode = auto
# El plugin de NiceGUI ejecuta este main por test (runpy, simulación sin servidor).
main_file = nicegui_ui/main.py
# Tests que abren un navegador de verdad (Playwright) para MEDIR estilos y contraste.
# Excluidos por defecto: exigen `playwright install chromium` (~150 MB) y un par de
# minutos, coste que no se quiere en cada `pytest`. Se corren a demanda:  pytest -m visual
markers =
    visual: verificacion visual en navegador real (lenta; ver nicegui_ui/tests/test_visual.py)

filterwarnings =
    ignore::DeprecationWarning
