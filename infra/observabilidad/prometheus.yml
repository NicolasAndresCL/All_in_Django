# Prometheus para el stack local. Se levanta aparte, con:
#   docker compose --env-file .env.docker --profile observabilidad up -d
#
# El scrape va contra el nombre de servicio de la red de compose (api:8000), no contra
# el puerto publicado en el host: asi funciona igual aunque API_PORT cambie.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: all_in_django
    metrics_path: /metrics
    # /metrics NO es publico en este proyecto (a diferencia del default de
    # django-prometheus): exige un bearer con METRICS_TOKEN. Prometheus lo manda
    # de forma nativa, asi que no hace falta un proxy delante.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["api:8000"]
        labels:
          servicio: api

  # La propia instancia, para poder distinguir "la app no responde" de
  # "Prometheus no esta scrapeando".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
