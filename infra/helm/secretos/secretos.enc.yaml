# Valores sensibles del chart. Se versiona CIFRADO (secretos.enc.yaml) con SOPS + age;
# este archivo en claro no debe existir en el repositorio.
#
# Editar SIEMPRE con sops, que descifra, abre el editor y vuelve a cifrar al guardar:
#
#     sops infra/helm/secretos/secretos.enc.yaml
#
# Desplegar SIN dejar el plano en disco (sops descifra a un temporal y lo borra al salir):
#
#     sops exec-file infra/helm/secretos/secretos.enc.yaml \
#         'helm upgrade --install all-in-django infra/helm/all-in-django -f {}'
#
# Los valores de abajo son MARCADORES a proposito: ninguno sirve para desplegar de verdad.
# El de SECRET_KEY ademas no pasa el gate de core/conf.py (>= 50 caracteres y >= 5
# distintos), asi que un despliegue que olvide reemplazarlos NO arranca en silencio: la API
# muere al iniciar diciendo por que. Un marcador que funciona es peor que uno que rompe.
