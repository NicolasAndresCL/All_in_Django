# Valores por defecto del chart. Sobreescribe con -f valores.yaml o --set.

image:
  registry: ghcr.io
  owner: nicolasandrescl        # ghcr.io/<owner>/all-in-django-{api,ui}
  # Vacio -> se usa el appVersion del Chart. Actions NO publica 'latest' (solo semver+sha),
  # asi que poner 'latest' aqui garantizaba un ImagePullBackOff.
  tag: ""
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources: {}
  # Probes → /healthz/ (SELECT 1). Ajusta si tu clúster es lento.

ui:
  replicas: 1
  resources: {}

# Config no sensible (va a un ConfigMap).
config:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: ""

# Secretos (van a un Secret). Pásalos con --set o un Secret pre-creado.
secret:
  # SECRET_KEY de Django (obligatorio con DEBUG=False).
  secretKey: ""
  # DATABASE_URL: si postgres.enabled=true se calcula solo; si no, ponla aquí.
  databaseUrl: ""
  # Token con el que la UI llama a la API. OBLIGATORIO, igual que el ${API_TOKEN:?} del
  # compose: sin él la UI arranca "sana" y devuelve 401 en cada vista — el falso positivo
  # que costó la sesión del 18 de agosto. Se crea tras el primer despliegue con
  #   kubectl exec deploy/<release>-api -- python manage.py drf_create_token <usuario>
  apiToken: ""
  # Bearer de /metrics. VACÍO A PROPÓSITO: sin token, core/metrics.py responde 404
  # (deshabilitado, no abierto), así que olvidarlo no publica las métricas por accidente.
  metricsToken: ""

# Observabilidad. Espeja lo que el compose y el Dockerfile ya hacen; sin esto un
# `helm install` arrancaba sin métricas agregadas y con los logs en texto plano.
observabilidad:
  # Anotaciones prometheus.io/* en el pod de la API. OJO: solo MARCAN el pod como
  # scrapeable — /metrics exige bearer, así que el job de Prometheus necesita además
  # el token (ver README.md del chart).
  scrapeAnnotations: true
  # Directorio compartido por los workers de gunicorn para agregar las métricas entre
  # procesos. Debe coincidir con PROMETHEUS_MULTIPROC_DIR del Dockerfile; el chart monta
  # ahí un emptyDir para que sea escribible y efímero por pod.
  multiprocDir: /tmp/prometheus
  # json en contenedor (un agregador filtra por campo en vez de adivinar con regex).
  logFormato: json
  logLevel: INFO

# Postgres embebido (StatefulSet). En producción, considera una base gestionada
# (postgres.enabled=false) e inyecta secret.databaseUrl.
postgres:
  enabled: true
  # postgres:18 movio PGDATA a /var/lib/postgresql/18/docker y su VOLUME a
  # /var/lib/postgresql; el StatefulSet monta el PVC ahi (ver templates/postgres.yaml).
  image: postgres:18-alpine
  user: app
  password: app
  database: all_in_django
  storage: 5Gi

ingress:
  enabled: false
  className: ""
  host: all-in-django.local
  annotations: {}
