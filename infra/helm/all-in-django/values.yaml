# Valores por defecto del chart. Sobreescribe con -f valores.yaml o --set.

image:
  registry: ghcr.io
  owner: nicolasandrescl        # ghcr.io/<owner>/all-in-django-{api,ui}
  # Vacio -> se usa el appVersion del Chart. Actions NO publica 'latest' (solo semver+sha),
  # asi que poner 'latest' aqui garantizaba un ImagePullBackOff.
  tag: ""
  pullPolicy: IfNotPresent

api:
  replicas: 1
  resources: {}
  # Probes → /healthz/ (SELECT 1). Ajusta si tu clúster es lento.

ui:
  replicas: 1
  resources: {}

# Config no sensible (va a un ConfigMap).
config:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: ""

# Secretos (van a un Secret). Pásalos con --set o un Secret pre-creado.
secret:
  # SECRET_KEY de Django (obligatorio con DEBUG=False).
  secretKey: ""
  # DATABASE_URL: si postgres.enabled=true se calcula solo; si no, ponla aquí.
  databaseUrl: ""
  # Token con el que la UI llama a la API. OBLIGATORIO, igual que el ${API_TOKEN:?} del
  # compose: sin él la UI arranca "sana" y devuelve 401 en cada vista — el falso positivo
  # que costó la sesión del 18 de agosto. Se crea tras el primer despliegue con
  #   kubectl exec deploy/<release>-api -- python manage.py drf_create_token <usuario>
  apiToken: ""
  # Bearer de /metrics. VACÍO A PROPÓSITO: sin token, core/metrics.py responde 404
  # (deshabilitado, no abierto), así que olvidarlo no publica las métricas por accidente.
  metricsToken: ""

# Observabilidad. Espeja lo que el compose y el Dockerfile ya hacen; sin esto un
# `helm install` arrancaba sin métricas agregadas y con los logs en texto plano.
observabilidad:
  # Anotaciones prometheus.io/* en el pod de la API. OJO: solo MARCAN el pod como
  # scrapeable — /metrics exige bearer, así que el job de Prometheus necesita además
  # el token (ver README.md del chart).
  scrapeAnnotations: true
  # Directorio compartido por los workers de gunicorn para agregar las métricas entre
  # procesos. Debe coincidir con PROMETHEUS_MULTIPROC_DIR del Dockerfile; el chart monta
  # ahí un emptyDir para que sea escribible y efímero por pod.
  multiprocDir: /tmp/prometheus
  # json en contenedor (un agregador filtra por campo en vez de adivinar con regex).
  logFormato: json
  logLevel: INFO

# Postgres embebido (StatefulSet). DESACTIVADO por defecto: el destino de este chart es
# AWS, donde el RDS ya lo provisiona Terraform (infra/terraform), y una base de datos en un
# StatefulSet es de las cosas que peor envejecen en un cluster — respaldos, failover y
# actualizaciones de version mayor pasan a ser tuyos.
#
# El puente entre los dos: el output `database_url` de Terraform (marcado sensitive) va al
# archivo cifrado del chart, no a un --set:
#
#   terraform -chdir=infra/terraform output -raw database_url
#   sops infra/helm/secretos/secretos.enc.yaml     # pegarlo en secret.databaseUrl
#
# CONTRAPARTIDA ASUMIDA: con esto los valores de fabrica ya NO despliegan solos — `helm
# install` aborta pidiendo `secret.databaseUrl`. Es una excepcion DELIBERADA a la regla de
# que los defaults funcionen (la que se aprendio con `image.tag: latest`), y se sostiene
# porque la diferencia es el tipo de fallo: aquel daba un ImagePullBackOff mudo, este aborta
# en el render diciendo exactamente que falta. Preferimos que obligue a decidir donde vive la
# base antes que crear en silencio un StatefulSet que en produccion seria un error.
# Para probar en local (kind/minikube), levanta la base embebida a proposito:
#   helm install ... --set postgres.enabled=true
postgres:
  enabled: false
  # postgres:18 movio PGDATA a /var/lib/postgresql/18/docker y su VOLUME a
  # /var/lib/postgresql; el StatefulSet monta el PVC ahi (ver templates/postgres.yaml).
  image: postgres:18-alpine
  user: app
  password: app
  database: all_in_django
  storage: 5Gi

ingress:
  enabled: false
  className: ""
  host: all-in-django.local
  annotations: {}
  # HTTPS con cert-manager. Requiere cert-manager instalado en el cluster y un dominio
  # real apuntando al Ingress: `all-in-django.local` no vale para emitir nada.
  tls:
    enabled: false
    # Emisor por defecto: STAGING. Produccion limita a 5 certificados por dominio y
    # semana, y unos pocos intentos con el DNS mal apuntado agotan la cuota durante dias.
    # Cuando staging emita bien, cambiar el par (clusterIssuer, acmeServer) a produccion:
    #   https://acme-v02.api.letsencrypt.org/directory
    clusterIssuer: letsencrypt-staging
    acmeServer: https://acme-staging-v02.api.letsencrypt.org/directory
    # Correo de la cuenta ACME (avisos de caducidad). Obligatorio si crearClusterIssuer.
    email: ""
    # false si el cluster ya tiene su ClusterIssuer: es un recurso CLUSTER-scoped y no
    # debe haber dos con el mismo nombre peleandose.
    crearClusterIssuer: true
    # Secret donde cert-manager deja el certificado. Vacio -> "<release>-tls". NO se
    # precrea ni se versiona: lo crea y lo renueva cert-manager.
    secretName: ""
