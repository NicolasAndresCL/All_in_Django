apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aid.fullname" . }}-secret
  labels:
    {{- include "aid.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.secretKey es obligatorio (--set secret.secretKey=...)" .Values.secret.secretKey | quote }}
  DATABASE_URL: {{ include "aid.databaseUrl" . | quote }}
  # Mismo fail-fast que ${API_TOKEN:?} en docker-compose.yml.
  API_TOKEN: {{ required "secret.apiToken es obligatorio (--set secret.apiToken=...): sin el la UI levanta sana y da 401 en cada vista" .Values.secret.apiToken | quote }}
  # Opcional a proposito: vacio -> /metrics responde 404 (deshabilitado, no abierto).
  METRICS_TOKEN: {{ .Values.secret.metricsToken | quote }}
